name: wef-production

x-logging: &production-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

x-application-security: &application-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

x-backend-environment: &backend-environment
  WEF_ADMIN_SESSION_SECRET: ${WEF_ADMIN_SESSION_SECRET:?WEF_ADMIN_SESSION_SECRET is required}
  WEF_AI_CURATION_ENABLED: ${WEF_AI_CURATION_ENABLED:-false}
  WEF_BOOTSTRAP_OWNER_PASSWORD: ${WEF_BOOTSTRAP_OWNER_PASSWORD:-}
  WEF_BOOTSTRAP_OWNER_USERNAME: ${WEF_BOOTSTRAP_OWNER_USERNAME:-}
  WEF_CONTACT_ENCRYPTION_KEY: ${WEF_CONTACT_ENCRYPTION_KEY:?WEF_CONTACT_ENCRYPTION_KEY is required}
  WEF_CONTACT_HMAC_KEY: ${WEF_CONTACT_HMAC_KEY:?WEF_CONTACT_HMAC_KEY is required}
  WEF_DATABASE_URL: ${WEF_DATABASE_URL:?WEF_DATABASE_URL is required}
  WEF_ENV: production
  WEF_GROQ_API_KEY: ${WEF_GROQ_API_KEY:-}
  WEF_GROQ_MODEL: ${WEF_GROQ_MODEL:-openai/gpt-oss-20b}
  WEF_GROQ_TIMEOUT_SECONDS: ${WEF_GROQ_TIMEOUT_SECONDS:-30}
  WEF_GROQ_ZDR_VERIFIED: ${WEF_GROQ_ZDR_VERIFIED:-false}
  WEF_LOG_LEVEL: ${WEF_LOG_LEVEL:-info}
  WEF_RELEASE_SHA: ${WEF_RELEASE_SHA:?WEF_RELEASE_SHA is required}

x-telegram-status-environment: &telegram-status-environment
  WEF_TELEGRAM_API_ID: ${WEF_TELEGRAM_API_ID:-}
  WEF_TELEGRAM_API_HASH: ${WEF_TELEGRAM_API_HASH:-}
  WEF_TELEGRAM_SESSION: ${WEF_TELEGRAM_SESSION:-}
  WEF_TELEGRAM_SESSION_PATH: /var/lib/wef/telegram/session
  WEF_TELEGRAM_RUNTIME_HEALTH_PATH: /var/lib/wef/state/telegram-worker-health.json

services:
  db-permissions:
    profiles:
      - operator
    image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
    user: "0:0"
    entrypoint: ["chown"]
    command: ["999:999", "/var/lib/postgresql/data"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 32
    logging: *production-logging
    volumes:
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  db:
    image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256m
    cpus: "1.50"
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *production-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - application

  migrate:
    profiles:
      - operator
    image: ${WEF_BACKEND_IMAGE:?WEF_BACKEND_IMAGE digest is required}
    command: ["wef-migrate"]
    environment: *backend-environment
    <<: *application-security
    restart: "no"
    cpus: "1.00"
    mem_limit: 512m
    pids_limit: 128
    logging: *production-logging
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application

  geocoder-check:
    profiles:
      - operator
    image: ${WEF_BACKEND_IMAGE:?WEF_BACKEND_IMAGE digest is required}
    command: ["wef-geocoder-check"]
    environment:
      WEF_ENV: production
      WEF_GEOAPIFY_API_KEY: ${WEF_GEOAPIFY_API_KEY:?WEF_GEOAPIFY_API_KEY is required}
    <<: *application-security
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 64
    logging: *production-logging
    networks:
      - provider-egress

  api:
    image: ${WEF_BACKEND_IMAGE:?WEF_BACKEND_IMAGE digest is required}
    environment:
      <<: [*backend-environment, *telegram-status-environment]
      WEF_TELEGRAM_RUNTIME_HEALTH_PATH: /tmp/wef-telegram-worker.health.json
    <<: *application-security
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: "1.00"
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 256
    logging: *production-logging
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/media/public
        target: /app/media/public
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/state/telegram-worker-health.json
        target: /tmp/wef-telegram-worker.health.json
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
    networks:
      - application

  web:
    image: ${WEF_WEB_IMAGE:?WEF_WEB_IMAGE digest is required}
    environment:
      WEF_API_URL: http://api:8000
      WEF_RELEASE_SHA: ${WEF_RELEASE_SHA:?WEF_RELEASE_SHA is required}
    <<: *application-security
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: "0.75"
    mem_limit: 512m
    mem_reservation: 64m
    pids_limit: 192
    logging: *production-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    expose:
      - "3000"
    networks:
      - application

  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "1000:1000"
    environment:
      WEF_RELEASE_SHA: ${WEF_RELEASE_SHA:?WEF_RELEASE_SHA is required}
    read_only: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /config:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped
    stop_grace_period: 15s
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 32m
    pids_limit: 128
    logging: *production-logging
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${WEF_BIND_ADDRESS:-0.0.0.0}:${WEF_PUBLIC_PORT:?WEF_PUBLIC_PORT is required}:8080"
    volumes:
      - type: bind
        source: ${WEF_RELEASE_DIR:?WEF_RELEASE_DIR is required}/Caddyfile.production
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/media/public
        target: /srv/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/caddy-data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8080/api/v1/health/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - application
      - edge

  seed:
    profiles:
      - rehearsal
    image: ${WEF_BACKEND_IMAGE:?WEF_BACKEND_IMAGE digest is required}
    command: ["wef-seed-m1"]
    environment:
      <<: *backend-environment
      WEF_ALLOW_SYNTHETIC_SEED: ${WEF_ALLOW_SYNTHETIC_SEED:-false}
    <<: *application-security
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    logging: *production-logging
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application

  telegram-worker:
    image: ${WEF_BACKEND_IMAGE:?WEF_BACKEND_IMAGE digest is required}
    command: ["wef-telegram-worker"]
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "wef-telegram-worker-status", "--liveness"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s
    environment:
      <<: [*backend-environment, *telegram-status-environment]
      WEF_TELEGRAM_API_ID: ${WEF_TELEGRAM_API_ID:?WEF_TELEGRAM_API_ID is required}
      WEF_TELEGRAM_API_HASH: ${WEF_TELEGRAM_API_HASH:?WEF_TELEGRAM_API_HASH is required}
      WEF_TELEGRAM_SESSION: ${WEF_TELEGRAM_SESSION:-}
      WEF_TELEGRAM_PHONE: ${WEF_TELEGRAM_PHONE:-}
      WEF_TELEGRAM_RECONCILIATION_INTERVAL_SECONDS: ${WEF_TELEGRAM_RECONCILIATION_INTERVAL_SECONDS:-60}
      WEF_TELEGRAM_RECONCILIATION_BATCH_SIZE: ${WEF_TELEGRAM_RECONCILIATION_BATCH_SIZE:-100}
      WEF_TELEGRAM_RECONCILIATION_MAX_MESSAGES: ${WEF_TELEGRAM_RECONCILIATION_MAX_MESSAGES:-500}
      WEF_TELEGRAM_RECONCILIATION_OVERLAP: ${WEF_TELEGRAM_RECONCILIATION_OVERLAP:-20}
      WEF_TELEGRAM_MEDIA_TEMP_PATH: /tmp/wef-telegram-media
      WEF_RESTRICTED_ORIGINALS_PATH: /app/media/originals
      WEF_PUBLIC_DERIVATIVES_PATH: /app/media/public
      WEF_TELEGRAM_RECURRING_GEOCODE_INTERVAL_SECONDS: ${WEF_TELEGRAM_RECURRING_GEOCODE_INTERVAL_SECONDS:-60}
      WEF_TELEGRAM_RECURRING_GEOCODE_BATCH_SIZE: ${WEF_TELEGRAM_RECURRING_GEOCODE_BATCH_SIZE:-10}
      WEF_GEOAPIFY_API_KEY: ${WEF_GEOAPIFY_API_KEY:-}
      WEF_GEOAPIFY_ACCOUNT_IDENTITY: ${WEF_GEOAPIFY_ACCOUNT_IDENTITY:-default}
      WEF_GEOAPIFY_REQUESTS_PER_SECOND: ${WEF_GEOAPIFY_REQUESTS_PER_SECOND:-4}
      WEF_GEOAPIFY_DAILY_QUOTA: ${WEF_GEOAPIFY_DAILY_QUOTA:-2700}
    <<: *application-security
    volumes:
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/secrets/telegram
        target: /var/lib/wef/telegram
        bind:
          create_host_path: false
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/state
        target: /var/lib/wef/state
        bind:
          create_host_path: false
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/media/originals
        target: /app/media/originals
        bind:
          create_host_path: false
      - type: bind
        source: ${WEF_ROOT:?WEF_ROOT is required}/media/public
        target: /app/media/public
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "0.50"
    mem_limit: 512m
    mem_reservation: 64m
    pids_limit: 128
    logging: *production-logging
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application
      - provider-egress

networks:
  application:
    internal: true
  edge:
  provider-egress:
