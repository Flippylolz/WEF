pid /var/run/nginx-media.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        location ~ (^|/)\. {
            return 404;
        }

        # Shared edge forwards the full /media/... URI; map it onto the public tree.
        location /media/ {
            alias /srv/media/;
        }

        location / {
            root /srv/media;
        }
    }
}
