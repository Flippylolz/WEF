name: Dependabot merge controller

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  statuses: read

jobs:
  merge:
    name: Evaluate and merge
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run Dependabot merge controller
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/dependabot_merge_controller.py --repository "${GITHUB_REPOSITORY}"
