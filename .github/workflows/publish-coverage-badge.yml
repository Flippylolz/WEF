name: Publish coverage badge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: publish-coverage-badge
  cancel-in-progress: true

jobs:
  publish:
    name: Publish coverage badge
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage badge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/coverage-badge
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify SVG artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "coverage-badge" / "coverage.svg"
          text = path.read_text(encoding="utf-8")
          if "<svg" not in text[:200]:
              raise SystemExit(f"{path} is not an SVG badge")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/coverage-badge
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
