name: E0 Architecture Proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e0-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend proof
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
        env:
          POSTGRES_DB: wef_proof
          POSTGRES_PASSWORD: proof
          POSTGRES_USER: wef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wef -d wef_proof"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://wef:proof@127.0.0.1:5432/wef_proof
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: 3.13.2
      - name: Install locked backend dependencies
        run: uv sync --project apps/backend --frozen
      - name: Check backend format and lint
        run: |
          uv run --project apps/backend ruff format --check apps/backend
          uv run --project apps/backend ruff check apps/backend
      - name: Check backend types
        run: uv run --project apps/backend mypy
      - name: Check architecture contracts
        env:
          PYTHONPATH: apps/backend/src
        run: |
          uv run --project apps/backend lint-imports --config .importlinter
          uv run --project apps/backend python apps/backend/scripts/prove_architecture_violation.py
      - name: Run backend and PostGIS tests
        run: >-
          uv run --project apps/backend pytest
          --cov=wef_backend
          --cov-branch
          --cov-report=term-missing
      - name: Check deterministic OpenAPI
        run: |
          uv run --project apps/backend wef-export-openapi
          git diff --exit-code -- contracts/openapi/v1.json
      - name: Audit Python dependencies
        run: uv run --project apps/backend pip-audit

  frontend:
    name: Frontend and contract proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.22.2
      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated contract and API docs
        run: |
          pnpm --filter web contract:check
          pnpm --filter web contract:lint
          pnpm --filter web contract:docs
      - name: Check OpenAPI compatibility
        shell: bash
        run: |
          mkdir -p tmp
          if [[ -n "${GITHUB_BASE_REF}" ]] &&
             git show "origin/${GITHUB_BASE_REF}:contracts/openapi/v1.json" > tmp/openapi-base.json 2>/dev/null; then
            docker run --rm \
              -v "${PWD}:/work" \
              tufin/oasdiff:v1.28.0@sha256:86830f988eaafcf589acb2794ee5ab78e3300ded071d6517bf085469300cbf36 \
              breaking /work/tmp/openapi-base.json /work/contracts/openapi/v1.json
          else
            cp contracts/openapi/v1.json tmp/openapi-base.json
            docker run --rm \
              -v "${PWD}:/work" \
              tufin/oasdiff:v1.28.0@sha256:86830f988eaafcf589acb2794ee5ab78e3300ded071d6517bf085469300cbf36 \
              breaking /work/tmp/openapi-base.json /work/contracts/openapi/v1.json
          fi
      - name: Check frontend quality
        run: |
          pnpm --filter web typecheck
          pnpm --filter web lint
          pnpm --filter web test
          pnpm --filter web build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openapi-v1-html
          path: tmp/openapi-v1.html
          if-no-files-found: error

  images:
    name: Safe image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build backend runtime image
        run: docker build --file apps/backend/Dockerfile --tag wef-backend:e0-proof .
      - name: Build frontend runtime image
        run: docker build --file apps/web/Dockerfile --tag wef-web:e0-proof .
      - name: Check runtime image contents and users
        run: |
          test "$(docker image inspect wef-backend:e0-proof --format '{{.Config.User}}')" = "wef"
          test "$(docker image inspect wef-web:e0-proof --format '{{.Config.User}}')" = "node"
          docker run --rm --entrypoint sh wef-backend:e0-proof -c \
            '! command -v uv && ! command -v pytest && ! command -v mypy && ! command -v ruff'
          docker run --rm --entrypoint sh wef-web:e0-proof -c \
            'test ! -e /app/contracts && test ! -e /app/apps/web/src'
