name: Release and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA already reachable from main
        required: true
        type: string
      seed_rehearsal:
        description: Seed the idempotent synthetic rehearsal fixture
        required: true
        default: false
        type: boolean
      force_rollback_rehearsal:
        description: Fail after healthy smoke and require automatic restoration
        required: true
        default: false
        type: boolean

concurrency:
  group: wef-release-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_VERSION: 3.13.2
  NODE_VERSION: 22.22.2
  PNPM_VERSION: 11.21.0
  UV_VERSION: 0.10.11

jobs:
  resolve:
    name: Resolve release gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      source_timestamp: ${{ steps.release.outputs.source_timestamp }}
      force_rollback_rehearsal: ${{ steps.release.outputs.force_rollback_rehearsal }}
      seed_rehearsal: ${{ steps.release.outputs.seed_rehearsal }}
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      gate_reason: ${{ steps.gate.outputs.gate_reason }}
      merged_at: ${{ steps.gate.outputs.merged_at }}
      reuse_run_id: ${{ steps.reuse.outputs.reuse_run_id }}
      fingerprint: ${{ steps.reuse.outputs.fingerprint }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

      - name: Resolve immutable release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          REQUESTED_ROLLBACK: ${{ inputs.force_rollback_rehearsal }}
          REQUESTED_SEED: ${{ inputs.seed_rehearsal }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            release_sha="$REQUESTED_SHA"
          else
            release_sha="$PUSH_SHA"
          fi
          resolved_sha=$(git rev-parse "${release_sha}^{commit}")
          test "$resolved_sha" = "$release_sha"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_sha" origin/main
          source_timestamp=$(git show -s --format=%cI "$release_sha")
          seed_rehearsal=false
          force_rollback_rehearsal=false
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$REQUESTED_SEED" == 'true' ]]; then
            seed_rehearsal=true
          fi
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$REQUESTED_ROLLBACK" == 'true' ]]; then
            force_rollback_rehearsal=true
          fi
          {
            echo "release_sha=$release_sha"
            echo "source_timestamp=$source_timestamp"
            echo "seed_rehearsal=$seed_rehearsal"
            echo "force_rollback_rehearsal=$force_rollback_rehearsal"
          } >> "$GITHUB_OUTPUT"

      - name: Read associated pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" > associated-prs.json
          else
            printf '[]\n' > associated-prs.json
          fi

      - name: Evaluate deployment gate
        id: gate
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.AUTO_DEPLOY_ENABLED || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.deploy.evaluate_deploy_gate \
            "$EVENT_NAME" \
            "$GITHUB_REF" \
            "$RELEASE_SHA" \
            "$AUTO_DEPLOY_ENABLED" \
            associated-prs.json --outputs >> "$GITHUB_OUTPUT"

      - name: Find completed exact-SHA verification
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          ALLOW_REUSE: ${{ github.event_name == 'workflow_dispatch' && !inputs.seed_rehearsal && !inputs.force_rollback_rehearsal }}
        run: python3 -m scripts.deploy.reuse_release find "$RELEASE_SHA"


  verify:
    name: Verify release candidate
    needs: resolve
    if: needs.resolve.outputs.reuse_run_id == ''
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ needs.resolve.outputs.release_sha }}

  build-backend:
    name: Build backend image
    needs: resolve
    if: needs.resolve.outputs.reuse_run_id == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.runtime.outputs.image }}
      digest: ${{ steps.runtime.outputs.digest }}
      cache_metrics: ${{ steps.runtime.outputs.cache_metrics }}
    steps:
      - name: Check out immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, inspect and publish backend
        id: runtime
        uses: ./.github/actions/runtime-image
        with:
          component: backend
          release_sha: ${{ needs.resolve.outputs.release_sha }}
          publish: 'true'

  build-web:
    name: Build web image
    needs: resolve
    if: needs.resolve.outputs.reuse_run_id == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.runtime.outputs.image }}
      digest: ${{ steps.runtime.outputs.digest }}
      cache_metrics: ${{ steps.runtime.outputs.cache_metrics }}
    steps:
      - name: Check out immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, inspect and publish web
        id: runtime
        uses: ./.github/actions/runtime-image
        with:
          component: web
          release_sha: ${{ needs.resolve.outputs.release_sha }}
          publish: 'true'

  runtime:
    name: Runtime proof
    needs: [resolve, build-backend, build-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prove the exact published images
        env:
          BACKEND: ${{ needs.build-backend.outputs.image }}@${{ needs.build-backend.outputs.digest }}
          WEB: ${{ needs.build-web.outputs.image }}@${{ needs.build-web.outputs.digest }}
        run: |
          docker pull "$BACKEND"
          docker pull "$WEB"
          docker tag "$BACKEND" wef-backend:local
          docker tag "$WEB" wef-web:local
          make production-runtime-proof

  publish:
    name: Publish immutable images
    needs:
      - resolve
      - verify
      - build-backend
      - build-web
      - runtime
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.reuse_run_id != '' ||
       (needs.verify.result == 'success' && needs.build-backend.result == 'success' &&
        needs.build-web.result == 'success' && needs.runtime.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      backend_digest: ${{ steps.evidence.outputs.backend_digest }}
      backend_image: ${{ steps.evidence.outputs.backend_image }}
      web_digest: ${{ steps.evidence.outputs.web_digest }}
      web_image: ${{ steps.evidence.outputs.web_image }}
      reused_verified: ${{ steps.evidence.outputs.reused_verified }}
    steps:
      - name: Check out immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}

      - name: Download previously verified release
        if: needs.resolve.outputs.reuse_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.resolve.outputs.release_sha }}
          path: ${{ runner.temp }}/release
          run-id: ${{ needs.resolve.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Assemble release artifact
        if: needs.resolve.outputs.reuse_run_id == ''
        env:
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          MIGRATION_REVISION: ${{ needs.verify.outputs.migration_revision }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          VERIFICATION_FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
          SOURCE_TIMESTAMP: ${{ needs.resolve.outputs.source_timestamp }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release/scripts"
          cp infra/compose.production.yaml "$RUNNER_TEMP/release/"
          cp infra/compose.production-cutover.yaml "$RUNNER_TEMP/release/"
          cp infra/compose.production-shared-edge.yaml "$RUNNER_TEMP/release/"
          cp infra/compose.candidate.yaml "$RUNNER_TEMP/release/"
          cp infra/Caddyfile.production "$RUNNER_TEMP/release/"
          mkdir -p "$RUNNER_TEMP/release/nginx"
          cp infra/nginx/media-edge.conf "$RUNNER_TEMP/release/nginx/"
          cp -R scripts/deploy "$RUNNER_TEMP/release/scripts/"
          cp -R scripts/transfer "$RUNNER_TEMP/release/scripts/"
          cp scripts/transfer_bundle.py "$RUNNER_TEMP/release/scripts/"
          cp scripts/transfer_remote.py "$RUNNER_TEMP/release/scripts/"
          cp scripts/transfer_candidate.py "$RUNNER_TEMP/release/scripts/"
          cp scripts/transfer_restore.py "$RUNNER_TEMP/release/scripts/"
          touch "$RUNNER_TEMP/release/scripts/__init__.py"
          python3 -m scripts.deploy.create_release_manifest \
            "$RUNNER_TEMP/release/release-manifest.json" \
            "$RELEASE_SHA" \
            "$SOURCE_TIMESTAMP" \
            "$MIGRATION_REVISION" \
            "$BACKEND_DIGEST" \
            "$WEB_DIGEST" \
            --verification-fingerprint "$VERIFICATION_FINGERPRINT"
          python3 -c 'import pathlib,shutil,sys; [shutil.rmtree(p) for p in pathlib.Path(sys.argv[1]).rglob("__pycache__")]' "$RUNNER_TEMP/release"
          python3 -m scripts.deploy.create_checksums "$RUNNER_TEMP/release"

      - name: Validate release evidence
        id: evidence
        env:
          VERIFICATION_FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          REUSE_RUN_ID: ${{ needs.resolve.outputs.reuse_run_id }}
        run: python3 -m scripts.deploy.reuse_release validate "$RELEASE_SHA" --root "$RUNNER_TEMP/release"
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.resolve.outputs.release_sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy verified release
    needs:
      - resolve
      - publish
    if: needs.resolve.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: wef-production
      cancel-in-progress: false
    outputs:
      observation: ${{ steps.deploy.outputs.observation }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.resolve.outputs.release_sha }}
          path: ${{ runner.temp }}/release

      - name: Build private release configuration
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          WEF_ADMIN_SESSION_SECRET: ${{ secrets.WEF_ADMIN_SESSION_SECRET }}
          WEF_ALLOW_SYNTHETIC_SEED: ${{ needs.resolve.outputs.seed_rehearsal }}
          WEF_BOOTSTRAP_OWNER_PASSWORD: ${{ secrets.WEF_BOOTSTRAP_OWNER_PASSWORD }}
          WEF_BOOTSTRAP_OWNER_USERNAME: ${{ secrets.WEF_BOOTSTRAP_OWNER_USERNAME }}
          WEF_CONTACT_ENCRYPTION_KEY: ${{ secrets.WEF_CONTACT_ENCRYPTION_KEY }}
          WEF_CONTACT_HMAC_KEY: ${{ secrets.WEF_CONTACT_HMAC_KEY }}
          WEF_GEOAPIFY_API_KEY: ${{ secrets.WEF_GEOAPIFY_API_KEY }}
          WEF_AI_CURATION_ENABLED: ${{ vars.WEF_AI_CURATION_ENABLED }}
          WEF_AI_RECOVERY_ENABLED: ${{ vars.WEF_AI_RECOVERY_ENABLED }}
          WEF_AI_RECOVERY_ACTIVATION_VERIFIED: ${{ vars.WEF_AI_RECOVERY_ACTIVATION_VERIFIED }}
          WEF_AI_RECOVERY_AUTO_APPLY: ${{ vars.WEF_AI_RECOVERY_AUTO_APPLY }}
          WEF_AI_RECOVERY_OWNER_ID: ${{ vars.WEF_AI_RECOVERY_OWNER_ID }}
          WEF_GROQ_API_KEY: ${{ secrets.WEF_GROQ_API_KEY }}
          WEF_GROQ_MODEL: ${{ vars.WEF_GROQ_MODEL }}
          WEF_GROQ_TIMEOUT_SECONDS: ${{ vars.WEF_GROQ_TIMEOUT_SECONDS }}
          WEF_GROQ_ZDR_VERIFIED: ${{ vars.WEF_GROQ_ZDR_VERIFIED }}
          WEF_GROQ_USE_BATCH_API: ${{ vars.WEF_GROQ_USE_BATCH_API }}
          WEF_GROQ_BATCH_CHUNK_SIZE: ${{ vars.WEF_GROQ_BATCH_CHUNK_SIZE }}
          WEF_GROQ_BATCH_POLL_INTERVAL_SECONDS: ${{ vars.WEF_GROQ_BATCH_POLL_INTERVAL_SECONDS }}
          WEF_GROQ_BATCH_MAX_WAIT_SECONDS: ${{ vars.WEF_GROQ_BATCH_MAX_WAIT_SECONDS }}
          WEF_LOG_LEVEL: ${{ vars.WEF_LOG_LEVEL }}
          WEF_TELEGRAM_API_HASH: ${{ secrets.WEF_TELEGRAM_API_HASH }}
          WEF_TELEGRAM_API_ID: ${{ secrets.WEF_TELEGRAM_API_ID }}
          WEF_TELEGRAM_PHONE: ${{ secrets.WEF_TELEGRAM_PHONE }}
          WEF_TELEGRAM_SESSION: ${{ secrets.WEF_TELEGRAM_SESSION }}
        run: |
          set -euo pipefail
          chmod 0750 "$RUNNER_TEMP"/release/scripts/deploy/*.sh
          python3 -m scripts.deploy.build_release_config \
            "$RUNNER_TEMP/production.env" \
            /home/nuc/wef \
            "/home/nuc/wef/releases/${{ needs.resolve.outputs.release_sha }}" \
            "${{ needs.resolve.outputs.release_sha }}" \
            "${{ vars.WEF_PUBLIC_PORT }}" \
            "${{ vars.WEF_BIND_ADDRESS }}" \
            "${{ needs.publish.outputs.backend_image }}@${{ needs.publish.outputs.backend_digest }}" \
            "${{ needs.publish.outputs.web_image }}@${{ needs.publish.outputs.web_digest }}"

      - name: Transfer, activate, and verify release
        id: deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          FORCE_ROLLBACK_REHEARSAL: ${{ needs.resolve.outputs.force_rollback_rehearsal }}
          PUBLIC_PORT: ${{ vars.WEF_PUBLIC_PORT }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          SEED_REHEARSAL: ${{ needs.resolve.outputs.seed_rehearsal }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          # shellcheck disable=SC2029
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$PUBLIC_PORT" =~ ^[0-9]{4,5}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$GHCR_TOKEN"

          ssh_dir="$RUNNER_TEMP/wef-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_options=(
            -i "$ssh_dir/key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -p "$SSH_PORT"
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          incoming_release="/home/nuc/wef/releases/.incoming-${RELEASE_SHA}-${GITHUB_RUN_ID}"
          release_dir="/home/nuc/wef/releases/${RELEASE_SHA}"
          incoming_secret="/home/nuc/wef/secrets/releases/.incoming-${RELEASE_SHA}-${GITHUB_RUN_ID}"
          config_file="/home/nuc/wef/secrets/releases/${RELEASE_SHA}/production.env"
          inventory_before="/home/nuc/wef/state/inventory-${GITHUB_RUN_ID}-before.json"
          inventory_after="/home/nuc/wef/state/inventory-${GITHUB_RUN_ID}-after.json"

          observation_file="/home/nuc/wef/state/release-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          retry_transfer() {
            local delay
            for delay in 0 5 15; do
              if [[ "$delay" != 0 ]]; then sleep "$delay"; fi
              if "$@"; then return 0; fi
            done
            return 1
          }
          registry_logged_in=0
          cleanup() {
            # Export only the allowlisted observation, even if activation failed.
            # A missing report must not change the original deployment exit status.
            # shellcheck disable=SC2029
            if ssh "${ssh_options[@]}" "$target" \
              "python3 -B '$release_dir/scripts/deploy/release_observation.py' export '$observation_file' '$RELEASE_SHA'" \
              > "$RUNNER_TEMP/deploy-observation.json" 2>/dev/null; then
              printf 'observation=%s\n' "$(cat "$RUNNER_TEMP/deploy-observation.json")" >> "$GITHUB_OUTPUT"
              # shellcheck disable=SC2029
              ssh "${ssh_options[@]}" "$target" "rm -f -- '$observation_file'" >/dev/null 2>&1 || true
            fi
            rm -f "$RUNNER_TEMP/production.env"
            # shellcheck disable=SC2029
            ssh "${ssh_options[@]}" "$target" \
              "rm -rf -- '$incoming_release' '$incoming_secret'" >/dev/null 2>&1 || true
            if [[ "$registry_logged_in" == 1 ]]; then
              ssh "${ssh_options[@]}" "$target" 'flock -n /home/nuc/wef/state/deploy.lock docker logout ghcr.io' >/dev/null 2>&1 || true
            fi
            rm -f "$ssh_dir/key"
          }
          trap cleanup EXIT

          # The production job owns the shared Actions lock before any host mutation.
          ssh "${ssh_options[@]}" "$target" python3 - snapshot /home/nuc/wef \
            < scripts/deploy/release_order.py > "$RUNNER_TEMP/current-release.json"
          expected_current=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_sha"] or "none")' \
            "$RUNNER_TEMP/current-release.json")
          git fetch --no-tags origin main
          order=$(python3 -m scripts.deploy.release_order decide \
            "$RUNNER_TEMP/current-release.json" "$RUNNER_TEMP/release/release-manifest.json")
          if [[ "$order" == superseded ]]; then
            if [[ "$SEED_REHEARSAL" == true || "$FORCE_ROLLBACK_REHEARSAL" == true ]]; then
              echo 'Cannot rehearse a superseded candidate; no production change was made.' >&2
              exit 1
            fi
            python3 -m scripts.deploy.release_order observation "$RELEASE_SHA" superseded >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" \
            "install -m 0750 -d '$incoming_release' '$incoming_secret'"
          retry_transfer rsync -a --delete \
            -e "ssh -i '$ssh_dir/key' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$ssh_dir/known_hosts' -p '$SSH_PORT'" \
            "$RUNNER_TEMP/release/" "$target:$incoming_release/"
          retry_transfer rsync \
            -e "ssh -i '$ssh_dir/key' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$ssh_dir/known_hosts' -p '$SSH_PORT'" \
            "$RUNNER_TEMP/production.env" "$target:$incoming_secret/production.env"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" \
            "cd '$incoming_release' && sha256sum --check SHA256SUMS"

          if [[ "$order" == same && "$SEED_REHEARSAL" != true && "$FORCE_ROLLBACK_REHEARSAL" != true ]]; then
            # shellcheck disable=SC2029
            ssh "${ssh_options[@]}" "$target" \
              "cmp '$incoming_secret/production.env' '$config_file' && '$incoming_release/scripts/deploy/verify_current.sh' /home/nuc/wef '$release_dir' '$config_file' '$RELEASE_SHA' '$PUBLIC_PORT'"
            python3 -m scripts.deploy.release_order observation "$RELEASE_SHA" already_current >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ssh "${ssh_options[@]}" "$target" bash -s -- \
            "$incoming_release" "$release_dir" "$incoming_secret" "$(dirname "$config_file")" <<'REMOTE'
          set -euo pipefail
          incoming_release=$1
          release_dir=$2
          incoming_secret=$3
          secret_dir=$4
          case "$incoming_release:$release_dir:$incoming_secret:$secret_dir" in
            /home/nuc/wef/releases/.incoming-*:/home/nuc/wef/releases/*:/home/nuc/wef/secrets/releases/.incoming-*:/home/nuc/wef/secrets/releases/*) ;;
            *) exit 64 ;;
          esac
          chmod 0750 \
            "$incoming_release" \
            "$incoming_release/scripts" \
            "$incoming_release/scripts/deploy" \
            "$incoming_release/scripts/deploy"/*.sh
          chmod 0640 \
            "$incoming_release/Caddyfile.production" \
            "$incoming_release/compose.production.yaml" \
            "$incoming_release/release-manifest.json" \
            "$incoming_release/SHA256SUMS" \
            "$incoming_release/scripts/deploy"/*.py
          chmod 0750 "$incoming_secret"
          chmod 0600 "$incoming_secret/production.env"
          if [[ -e "$release_dir" ]]; then
            diff -qr "$incoming_release" "$release_dir"
            rm -rf -- "$incoming_release"
          else
            mv "$incoming_release" "$release_dir"
          fi
          if [[ -e "$secret_dir/production.env" ]]; then
            cmp "$incoming_secret/production.env" "$secret_dir/production.env"
            rm -rf -- "$incoming_secret"
          else
            mv "$incoming_secret" "$secret_dir"
          fi
          REMOTE

          if [[ "$FORCE_ROLLBACK_REHEARSAL" == 'true' ]]; then
            ssh "${ssh_options[@]}" "$target" bash -s -- "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          candidate_sha=$1
          test -f /home/nuc/wef/state/current.json
          current_sha=$(
            python3 /home/nuc/wef/releases/current/scripts/deploy/release_state.py \
              get /home/nuc/wef/state/current.json release_sha
          )
          test "$current_sha" != "$candidate_sha"
          REMOTE
          fi

          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" \
            "umask 077; '$release_dir/scripts/deploy/server_inventory.sh' > '$inventory_before'"
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$target" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          registry_logged_in=1
          deploy_command=(
            env
            PYTHONDONTWRITEBYTECODE=1
            "WEF_ROOT=/home/nuc/wef"
            "WEF_RELEASE_DIR=$release_dir"
            "WEF_CONFIG_FILE=$config_file"
            "WEF_RELEASE_OBSERVATION=$observation_file"
            "WEF_EXPECTED_CURRENT_SHA=$expected_current"
          )
          if [[ "$SEED_REHEARSAL" == 'true' ]]; then
            deploy_command+=("WEF_SEED_REHEARSAL=1")
          fi
          if [[ "$FORCE_ROLLBACK_REHEARSAL" == 'true' ]]; then
            deploy_command+=("WEF_FORCE_ROLLBACK_REHEARSAL=1")
          fi
          deploy_command+=(
            "$release_dir/scripts/deploy/deploy.sh"
            /home/nuc/wef
            "$release_dir"
            "$config_file"
            "$RELEASE_SHA"
            "$PUBLIC_PORT"
          )
          set +e
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "${deploy_command[@]}"
          deploy_status=$?
          set -e
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" \
            "umask 077; '$release_dir/scripts/deploy/server_inventory.sh' > '$inventory_after'"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" \
            "python3 '$release_dir/scripts/deploy/compare_server_inventory.py' '$inventory_before' '$inventory_after'"
          if [[ "$FORCE_ROLLBACK_REHEARSAL" == 'true' && "$deploy_status" -eq 42 ]]; then
            ssh "${ssh_options[@]}" "$target" bash -s -- \
              "$release_dir" "$RELEASE_SHA" "$inventory_before" "$inventory_after" <<'REMOTE'
          set -euo pipefail
          release_dir=$1
          failed_sha=$2
          before_inventory=$3
          after_inventory=$4
          healthy_sha=$(
            python3 "$release_dir/scripts/deploy/release_state.py" \
              get /home/nuc/wef/state/current.json release_sha
          )
          cd "$release_dir"
          python3 -m scripts.deploy.verify_rollback_rehearsal \
            /home/nuc/wef \
            "$healthy_sha" \
            "$failed_sha" \
            "$before_inventory" \
            "$after_inventory"
          REMOTE
            echo 'Rollback rehearsal restored the previous healthy release.'
          elif [[ "$deploy_status" -ne 0 ]]; then
            exit "$deploy_status"
          elif [[ "$FORCE_ROLLBACK_REHEARSAL" == 'true' ]]; then
            echo 'Rollback rehearsal did not exercise the expected failure path.' >&2
            exit 1
          fi

          # One-time owner bootstrap when credentials are present in the release env.
          ssh "${ssh_options[@]}" "$target" bash -s -- "$release_dir" "$config_file" <<'REMOTE'
          set -euo pipefail
          release_dir=$1
          config_file=$2
          if ! grep -q '^WEF_BOOTSTRAP_OWNER_USERNAME=' "$config_file"; then
            echo 'Owner bootstrap skipped (credentials not in release config).'
            exit 0
          fi
          cd "$release_dir"
          docker compose --env-file "$config_file" --file compose.production.yaml \
            run --rm --no-deps api wef-bootstrap-owner
          REMOTE

  report:
    name: Release outcome
    if: always()
    needs: [resolve, verify, build-backend, build-web, publish, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out reporting source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record release outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m scripts.deploy.release_report "$RUNNER_TEMP/release-outcome.json"
      - name: Upload sanitized release outcome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-outcome.json
          if-no-files-found: error
          retention-days: 90
