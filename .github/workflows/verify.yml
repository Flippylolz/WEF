name: Shared exact-SHA verification

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      migration_revision:
        value: ${{ jobs.backend.outputs.migration_revision }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    outputs:
      migration_revision: ${{ steps.metadata.outputs.migration_revision }}
    services:
      postgis:
        image: "postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708"
        env:
          POSTGRES_DB: wef_proof
          POSTGRES_PASSWORD: proof
          POSTGRES_USER: wef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wef -d wef_proof"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://wef:proof@127.0.0.1:5432/wef_proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.10.11
          enable-cache: true
          python-version: 3.13.2
      - name: Install locked dependencies
        run: uv sync --project apps/backend --frozen
      - name: Format and lint
        run: |
          uv --directory apps/backend run ruff format --check .
          uv --directory apps/backend run ruff check .
      - name: Type check
        run: uv --directory apps/backend run mypy
      - name: Architecture contracts
        run: |
          cd apps/backend
          PYTHONPATH=src uv run lint-imports --config ../../.importlinter
          uv run python scripts/prove_architecture_violation.py
      - name: Tests with PostGIS
        run: |
          mkdir -p tmp
          uv --directory apps/backend run pytest \
            --cov=wef_backend \
            --cov-branch \
            --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=json:../../tmp/backend-coverage.json
      - name: Upload backend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ inputs.source_sha }}
          path: tmp/backend-coverage.json
          if-no-files-found: error
      - name: Deterministic OpenAPI
        run: |
          uv --directory apps/backend run wef-export-openapi
          git diff --exit-code -- contracts/openapi/v1.json
      - name: Dependency audit
        run: uv --directory apps/backend run pip-audit
      - name: Resolve migration metadata
        id: metadata
        run: |
          revision=$(uv --directory apps/backend run python -c \
            'from wef_backend.migration import EXPECTED_DATABASE_REVISION; print(EXPECTED_DATABASE_REVISION)')
          echo "migration_revision=$revision" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend and contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
      - name: Enable locked pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format, lint, and type
        run: |
          pnpm --filter web format:check
          pnpm --filter web lint
          pnpm --filter web typecheck
      - name: Tests with 90% coverage
        run: pnpm --filter web test:coverage
      - name: Contract and static documentation
        run: |
          pnpm --filter web contract:check
          pnpm --filter web contract:lint
          pnpm --filter web contract:docs
          python3 scripts/prove_contract_drift.py
      - name: OpenAPI compatibility
        shell: bash
        run: |
          mkdir -p tmp
          if [[ -n "${GITHUB_BASE_REF}" ]] &&
             git show "origin/${GITHUB_BASE_REF}:contracts/openapi/v1.json" > tmp/openapi-base.json 2>/dev/null; then
            true
          else
            cp contracts/openapi/v1.json tmp/openapi-base.json
          fi
          docker run --rm \
            -v "${PWD}:/work" \
            tufin/oasdiff:v1.28.0@sha256:86830f988eaafcf589acb2794ee5ab78e3300ded071d6517bf085469300cbf36 \
            breaking --fail-on ERR /work/tmp/openapi-base.json /work/contracts/openapi/v1.json
      - name: Breaking OpenAPI negative probe
        shell: bash
        run: |
          python3 -c 'import json; p="contracts/openapi/v1.json"; d=json.load(open(p)); del d["paths"]["/api/v1/map/locations"]; json.dump(d, open("tmp/openapi-breaking-probe.json", "w"))'
          status=0
          docker run --rm \
            -v "${PWD}:/work" \
            tufin/oasdiff:v1.28.0@sha256:86830f988eaafcf589acb2794ee5ab78e3300ded071d6517bf085469300cbf36 \
            breaking --fail-on ERR /work/contracts/openapi/v1.json /work/tmp/openapi-breaking-probe.json || status=$?
          if [[ "${status}" -eq 0 ]]; then
            echo "oasdiff accepted a deliberately removed endpoint"
            exit 1
          fi
          rm tmp/openapi-breaking-probe.json
          echo "oasdiff rejected the deliberate endpoint removal"
      - name: Production build and advisory audit
        run: |
          pnpm --filter web build
          pnpm audit --prod --audit-level high
      - name: Playwright critical path
        env:
          NEXT_PUBLIC_WEF_DISABLE_MAP: "1"
        run: |
          pnpm --filter web build
          pnpm --filter web test:e2e:install
          pnpm --filter web test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-contract-${{ inputs.source_sha }}
          path: |
            contracts/openapi/v1.json
            apps/web/src/generated/api.ts
            tmp/openapi-v1.html
          if-no-files-found: error
      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-${{ inputs.source_sha }}
          path: apps/web/coverage/coverage-summary.json
          if-no-files-found: error

  coverage:
    name: Coverage badge
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-coverage-${{ inputs.source_sha }}"
          path: tmp/coverage
          merge-multiple: true
      - name: Enforce 90% coverage and render badge
        run: |
          python3 scripts/render_coverage_badge.py \
            --backend tmp/coverage/backend-coverage.json \
            --frontend tmp/coverage/coverage-summary.json \
            --output tmp/coverage-badge/coverage.svg \
            --fail-under 90
      - name: Upload coverage badge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge-${{ inputs.source_sha }}
          path: tmp/coverage-badge/coverage.svg
          if-no-files-found: error

  repository:
    name: Repository safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.10.11
          enable-cache: true
          python-version: 3.13.2
      - name: Quality probe scripts
        run: |
          uv sync --project apps/backend --frozen
          uv --directory apps/backend run ruff format --check ../../scripts
          uv --directory apps/backend run ruff check ../../scripts
          uv --directory apps/backend run mypy --strict ../../scripts
          python3 -m unittest scripts.test_release_order scripts.test_release_report scripts.test_render_coverage_badge scripts.test_shared_edge_render scripts.test_shared_edge_release scripts.test_shared_edge_preflight scripts.test_shared_edge_inventory scripts.test_shared_edge_smoke scripts.test_shared_edge_cutover scripts.test_transfer_foundation scripts.test_transfer_bundle scripts.test_candidate_config scripts.test_transfer_remote scripts.test_transfer_candidate scripts.test_transfer_restore scripts.test_transfer_postgres_restore scripts.test_activate_historical_candidate scripts.test_operator_diagnostics scripts.test_compare_server_inventory scripts.test_production_runtime_directories scripts.test_dependabot_config scripts.test_dependabot_merge_controller scripts.test_deploy_shared_edge_reconnect scripts.test_check_telegram_passive_events
      - name: Relative Markdown links
        run: python3 scripts/check_markdown_links.py
      - name: Local Compose model
        run: |
          make compose-config
          make production-proof
      - name: Source and secret exclusions
        shell: bash
        run: |
          test ! -e est-test
          test ! -e est-test.tar.gz
          test ! -e .env
          ! git ls-files | grep -E '(^|/)(est-test|media|secrets)(/|$)|\.session(-journal)?$|\.pem$|\.key$'

