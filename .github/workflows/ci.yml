name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verification
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ github.sha }}
  required:
    name: ${{ matrix.check }}
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        check: [Backend, Frontend and contract, Repository safety, Coverage badge]
    steps:
      - name: Enforce complete shared verification
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
  images:
    name: Runtime images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and inspect backend
        uses: ./.github/actions/runtime-image
        with:
          component: backend
          release_sha: ${{ github.sha }}
      - name: Build and inspect web
        uses: ./.github/actions/runtime-image
        with:
          component: web
          release_sha: ${{ github.sha }}
      - name: Production topology runtime
        run: make production-runtime-proof
