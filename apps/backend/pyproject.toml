[project]
name = "wef-backend"
version = "0.1.0"
description = "Backend-centric WEF architecture proof"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "itsdangerous>=2.2.0",
    "pillow>=12.1.1",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "starlette-admin>=0.17.1",
    "structlog>=26.1.0",
    "telethon>=1.44.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
wef-backend = "wef_backend.cli:serve"
wef-export-openapi = "wef_backend.openapi_export:main"
wef-geocoder-check = "wef_backend.geocoder_check:main"
wef-revalidate-recurring-geocoder = "wef_backend.recurring_geocoder_command:main"
wef-importer-dry-run = "wef_backend.operator:main"
wef-import = "wef_backend.import_command:main"
wef-migrate = "wef_backend.migration:migrate"
wef-seed-m1 = "wef_backend.seed_command:main"
wef-promote-public-catalog = "wef_backend.promote_public_catalog_command:main"
wef-replay-parser = "wef_backend.raw_replay_command:main"
wef-accept-pending-geocode-pins = "wef_backend.accept_pending_geocode_pins_command:main"
wef-bootstrap-owner = "wef_backend.owner_command:main"
wef-verify-telegram-channel = "wef_backend.telegram_channel_command:main"
wef-telegram-backfill = "wef_backend.telegram_backfill_command:main"
wef-telegram-worker = "wef_backend.telegram_worker_command:main"
wef-telegram-worker-status = "wef_backend.telegram_worker_status_command:main"
wef-backfill-parse-issues = "wef_backend.backfill_parse_issues_command:main"
wef-backfill-property-type = "wef_backend.backfill_property_type_command:main"
wef-backfill-market-type = "wef_backend.backfill_market_type_command:main"
wef-backfill-location-display-name = "wef_backend.backfill_location_display_name_command:main"
wef-batch-ingestion-ai-parse = "wef_backend.batch_ingestion_ai_parse_command:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wef_backend"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a disposable PostGIS TEST_DATABASE_URL",
]

[tool.coverage.run]
branch = true
source = ["wef_backend"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D102",
    "D103",
    "D107",
    "PLR0913",
    "PLR2004",
    "S101",
    "S105",
    "S106",
    "S107",
]
"scripts/**/*.py" = [
    "T201",
]
